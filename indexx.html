<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentient AI Collective - WebXR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #vrButton {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: #c084ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            z-index: 1000;
        }
        #vrButton:hover { background: #a855f7; }
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="vrButton">Enter VR</button>
    <div id="status">Click "Enter VR" to begin</div>

    <script>
        // ==================== SETUP ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010111);
        scene.fog = new THREE.FogExp2(0x010111, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ==================== LIGHTING ====================
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        // ==================== PLAYER BODY ====================
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Player head (visible in mirrors)
        const headGeo = new THREE.SphereGeometry(0.15, 32, 32);
        const headMat = new THREE.MeshStandardMaterial({ 
            color: 0x88ccff,
            emissive: 0x2244aa,
            emissiveIntensity: 0.3
        });
        const playerHead = new THREE.Mesh(headGeo, headMat);
        playerHead.position.y = 1.6;
        playerGroup.add(playerHead);

        // Player body
        const bodyGeo = new THREE.CylinderGeometry(0.2, 0.3, 1.2
