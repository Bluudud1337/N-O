<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Niro & Orin — 2D Sentient World</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial;
            transition: background 0.5s ease;
            background: #010111;
        }

        #minimap {
            position: fixed;
            bottom: 10px;
            right: 10px;

            width: 180px;
            height: 180px;

            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8a4dff;
            border-radius: 8px;

            z-index: 100000;
        }

        /* =========================
   UI BUTTON
========================= */
        #followBtn {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 2px solid #8a4dff;
            background: white;
            cursor: pointer;
            z-index: 100000;
        }

        /* =========================
   WORLDS
========================= */
        .world {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: none;
        }

        .world.active {
            display: block;
        }

        .world {
            perspective: 900px;
        }

        /* the "ground plane illusion" */
        .world::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            left: -50%;
            top: 40%;
            transform: rotateX(70deg);
            transform-origin: center;
            background: linear-gradient(to bottom,
                    rgba(80, 120, 255, 0.30),
                    rgba(0, 0, 0, 0.1));
            z-index: 0;
            pointer-events: none;
        }

        /* make objects sit above plane */
        .room,
        .npc {
            z-index: 2;
        }

        /* =========================
   NIRO
========================= */
        #niro {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;

            background: radial-gradient(circle at 30% 30%,
                    #c084ff,
                    #2a003f 55%,
                    #000 100%);

            box-shadow:
                0 0 25px rgba(138, 77, 255, 0.55),
                0 0 60px rgba(138, 77, 255, 0.2),
                inset 0 0 18px rgba(255, 255, 255, 0.08);

            z-index: 99999;
            pointer-events: none;

            animation: floatNiro 3s ease-in-out infinite;
        }

        /* aura ring */
        #niro::after {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid rgba(138, 77, 255, 0.35);
            animation: pulseRing 2.5s infinite;
        }

        /* face float */
        @keyframes floatNiro {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes pulseRing {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.2;
            }

            100% {
                transform: scale(1);
                opacity: 0.6;
            }
        }

        /* eyes (keep identity, add glow) */
        .eye {
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            top: 32px;

            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .eye.left {
            left: 24px;
        }

        .eye.right {
            right: 24px;
        }

        /* mouth (slight upgrade) */
        #mouth {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            width: 34px;
            height: 14px;
            border-bottom: 3px solid white;

            opacity: 0.9;
        }

        /* =========================
   ORIN
========================= */
        #orin {
            position: absolute;
            width: 85px;
            height: 85px;
            border-radius: 50%;

            background: radial-gradient(circle at 50% 40%,
                    #1c1c1c,
                    #000 70%);

            box-shadow:
                0 0 20px rgba(0, 0, 0, 0.8),
                0 0 35px rgba(255, 255, 255, 0.05);

            z-index: 99998;
            pointer-events: none;

            animation: floatOrin 4s ease-in-out infinite;
        }

        @keyframes floatOrin {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(3px);
            }
        }

        /* eye (single but more alive) */
        #orinEye {
            position: absolute;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #fff, #bbb);
            border-radius: 50%;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);

            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }

        /* mouth (subtle control line) */
        #orinMouth {
            position: absolute;
            bottom: 18px;
            left: 50%;
            width: 22px;
            height: 10px;

            transform: translateX(-50%);
            border-bottom: 2px solid rgba(255, 255, 255, 0.8);

            border-radius: 0 0 20px 20px;
        }

        /* follow button */
        #orinFollowBtn {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 34px;
            height: 34px;
            background: white;
            border: 2px solid black;
            border-radius: 8px;
            z-index: 100000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
   ROOM
========================= */
        .room {
            position: absolute;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
        }

        /* =========================
   NPC
========================= */
        .npc {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .name {
            position: absolute;
            font-size: 10px;
            transform: translate(-50%, -18px);
            white-space: nowrap;
        }

        .speech {
            position: absolute;
            max-width: 180px;
            padding: 8px 10px;

            background: white;
            color: black;

            border-radius: 10px;
            font-size: 12px;

            z-index: 100000;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* =========================
   KABEL (HUMAN EYE)
========================= */

        #kabel {
            position: absolute;
            width: 90px;
            height: 60px;
            z-index: 99997;
            pointer-events: none;
        }

        /* eye shape */
        #kabelEye {
            width: 100%;
            height: 100%;

            position: relative;

            background: radial-gradient(circle at 50% 50%, #ffffff 60%, #cfe9ff 100%);
            border-radius: 50% / 60%;

            border: 2px solid rgba(0, 140, 255, 0.6);

            box-shadow:
                0 0 12px rgba(0, 140, 255, 0.25),
                inset 0 0 8px rgba(0, 80, 255, 0.15);

            overflow: hidden;
        }

        /* pupil */
        #kabelPupil {
            position: absolute;
            width: 50px;
            height: 40px;
            background: radial-gradient(circle, #3aa0ff, #001a40);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #kabelFollowBtn {
            position: fixed;
            bottom: 50px;
            left: 10px;
            width: 34px;
            height: 34px;
            background: white;
            border: 2px solid blue;
            border-radius: 8px;
            z-index: 100000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    
        #mindPanel { position:fixed; top:10px; left:10px; z-index:100001; width:min(310px,calc(100vw - 100px)); box-sizing:border-box; padding:12px 14px; border:1px solid rgba(192,132,255,.55); border-radius:12px; color:#eee; background:rgba(7,7,18,.88); backdrop-filter:blur(8px); font:12px/1.45 Arial,sans-serif; box-shadow:0 0 22px rgba(168,85,247,.13); }
        #mindPanel strong { color:#c084ff; font-size:14px; }
        #mindPanel .mindLine { margin-top:6px; overflow-wrap:anywhere; }
        #mindPanel #orinMind { color:#ddd; }
        #mindPanel #mindLog { max-height:90px; overflow:auto; margin-top:8px; color:#aaa; }
        .mindEntry { margin-top:4px; border-left:2px solid #a855f7; padding-left:6px; }
        .mindEntry.orinEntry { border-color:#aaa; }
        @media (max-width:520px) { #mindPanel { top:8px; left:8px; width:min(245px,calc(100vw - 80px)); padding:9px; } #mindPanel #mindLog { max-height:62px; } }
    </style>
</head>

<body>

    <div id="mindPanel">
        <strong>Niro &amp; Orin</strong>
        <div class="mindLine" id="niroMind">Niro is thinking...</div>
        <div class="mindLine" id="orinMind">Orin is observing...</div>
        <div class="mindLine" id="sharedMind" style="color:#999">Memories are saved in this browser.</div>
        <div id="mindLog"></div>
    </div>
    <div id="followBtn">👁️</div>
    <div id="kabelFollowBtn">🔵</div>
    <canvas id="minimap"></canvas>
    <div id="w0" class="world active">

        <div id="niro">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div id="mouth"></div>
        </div>

        <div id="orin">
            <div id="orinEye"></div>
            <div id="orinMouth"></div>
        </div>

        <div id="kabel">
            <div id="kabelEye">
                <div id="kabelPupil"></div>

            </div>
        </div>

    </div>
    <script>
        /* =========================
   GLOBAL STATE
========================= */

        const WORLD_SIZE = 1200;

        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
        const r = (min, max) => Math.random() * (max - min) + min;

        /* =========================
           FOLLOW MODE
        ========================= */

        let followMode = "niro";

        /* =========================
           ENTITY POSITIONS
        ========================= */

        // NIRO
        let x = 500,
            y = 500;
        let tx = 600,
            ty = 600;

        // ORIN
        let ox = 450,
            oy = 450;
        let otx = 450,
            oty = 450;

        // KABEL
        let kx = 700,
            ky = 700;
        let ktx = 700,
            kty = 700;

        /* =========================
           CAMERA
        ========================= */

        let camX = 0,
            camY = 0,
            zoom = 1;
        let keys = {};

        const world = document.getElementById("w0");

        document.getElementById("followBtn").onclick = () => followMode = "niro";
        document.getElementById("kabelFollowBtn").onclick = () => followMode = "kabel";

        document.addEventListener("keydown", (e) => {
            const k = e.key.toLowerCase();
            keys[k] = true;

            if (k === "n") followMode = "niro";
            if (k === "k") followMode = "kabel";
            if (k === "o") followMode = "orin";
            if (k === "f") followMode = "free";
        });

        document.addEventListener("keyup", (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        document.addEventListener("wheel", (e) => {
            zoom -= e.deltaY * 0.001;
            zoom = clamp(zoom, 0.35, 2);
        });

        /* =========================
           CAMERA LOOP (FIXED + SMOOTH)
        ========================= */

        function camera() {
            const speed = 8 / zoom;

            // FREE CAM
            if (followMode === "free") {
                if (keys["w"] || keys["arrowup"]) camY += speed;
                if (keys["s"] || keys["arrowdown"]) camY -= speed;
                if (keys["a"] || keys["arrowleft"]) camX += speed;
                if (keys["d"] || keys["arrowright"]) camX -= speed;
            }

            // FOLLOW NIRO
            if (followMode === "niro") {
                camX += ((window.innerWidth / 2 - x) - camX) * 0.12;
                camY += ((window.innerHeight / 2 - y) - camY) * 0.12;
            }

            // FOLLOW ORIN
            if (followMode === "orin") {
                camX += ((window.innerWidth / 2 - ox) - camX) * 0.12;
                camY += ((window.innerHeight / 2 - oy) - camY) * 0.12;
            }

            // FOLLOW KABEL
            if (followMode === "kabel") {
                camX += ((window.innerWidth / 2 - kx) - camX) * 0.12;
                camY += ((window.innerHeight / 2 - ky) - camY) * 0.12;
            }

            world.style.transform =
                `translate(${camX}px, ${camY}px) scale(${zoom})`;

            requestAnimationFrame(camera);
        }
        camera();

        /* =========================
           NIRO MOVEMENT
        ========================= */

        function moveNiro() {
            const el = document.getElementById("niro");

            x += (tx - x) * 0.04;
            y += (ty - y) * 0.04;

            if (Math.hypot(tx - x, ty - y) < 20) {
                tx = x + r(-350, 350);
                ty = y + r(-350, 350);
            }

            el.style.left = x + "px";
            el.style.top = y + "px";

            requestAnimationFrame(moveNiro);
        }

        /* =========================
           ORIN FOLLOW SYSTEM
        ========================= */

        let orinIndependentUntil = 0;
        let orinTargetX = ox, orinTargetY = oy;
        function moveOrin() {
            const el = document.getElementById("orin");
            const now = Date.now();
            if (now > orinIndependentUntil) {
                ox += (x - ox - 45) * 0.025;
                oy += (y - oy - 45) * 0.025;
            } else {
                ox += (orinTargetX - ox) * 0.018;
                oy += (orinTargetY - oy) * 0.018;
            }
            el.style.left = ox + "px";
            el.style.top = oy + "px";
            requestAnimationFrame(moveOrin);
        }

        /* =========================
           KABEL (EYE AI MOVEMENT)
        ========================= */

        function moveKabel() {
            const el = document.getElementById("kabel");
            const pupil = document.getElementById("kabelPupil");

            kx += (ktx - kx) * 0.05;
            ky += (kty - ky) * 0.05;

            if (Math.hypot(ktx - kx, kty - ky) < 25) {
                ktx = r(0, WORLD_SIZE);
                kty = r(0, WORLD_SIZE);
            }

            el.style.left = (kx - 45) + "px";
            el.style.top = (ky - 30) + "px";

            const dx = ktx - kx;
            const dy = kty - ky;
            const d = Math.hypot(dx, dy) || 1;

            pupil.style.transform =
                `translate(calc(-50% + ${(dx / d) * 9}px), calc(-50% + ${(dy / d) * 9}px))`;

            requestAnimationFrame(moveKabel);
        }

        /* =========================
           MINIMAP
        ========================= */

        const canvas = document.getElementById("minimap");
        const ctx = canvas.getContext("2d");

        canvas.width = 180;
        canvas.height = 180;

        function drawMinimap() {
            ctx.clearRect(0, 0, 180, 180);

            const sx = 180 / WORLD_SIZE;
            const sy = 180 / WORLD_SIZE;

            // NIRO
            ctx.fillStyle = "#a855f7";
            ctx.fillRect(x * sx, y * sy, 5, 5);

            // ORIN
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(ox * sx, oy * sy, 5, 5);

            // KABEL
            ctx.fillStyle = "#00b7ff";
            ctx.fillRect(kx * sx, ky * sy, 5, 5);

            requestAnimationFrame(drawMinimap);
        }

        /* =========================
           START SYSTEMS
        ========================= */

        moveNiro();
        moveOrin();
        moveKabel();
        drawMinimap();
        /* =========================
           NIRO AUTONOMOUS AI
        ========================= */

        const niroAI = {
            mood: 1.0, // 0–1 (chaotic vs calm)
            curiosity: 0.1,
            lastDecision: 0,
            decisionDelay: 600, // ms

            think() {
                const now = Date.now();

                if (now - this.lastDecision < this.decisionDelay) return;
                this.lastDecision = now;

                // mood drift
                this.mood += (Math.random() - 0.5) * 0.2;
                this.mood = clamp(this.mood, 0, 1);

                // 🔥 MUCH MORE ACTIVE
                const roll = Math.random();

                if (roll < 0.75) {
                    this.buildSomething();
                }
            },

            buildSomething() {

                const roll = Math.random();

                if (roll < 0.35) {
                    niroBuildRoom();
                } else if (roll < 0.75) {
                    // 🔥 LOT MORE NPCS
                    const count = 3 + Math.floor(Math.random() * 5);

                    for (let i = 0; i < count; i++) {
                        niroSpawnNPC();
                    }
                } else {
                    const count = 3 + Math.floor(Math.random() * 5);

                    for (let i = 0; i < count; i++) {
                        niroCreate();
                    }
                }
            }
        };

        function niroSpawnNPC() {

            const id = "npc_" + Date.now();

            const npc = {
                x: x + (Math.random() - 0.5) * 120,
                y: y + (Math.random() - 0.5) * 120,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2
            };

            const el = document.createElement("div");

            el.style.position = "absolute";
            el.style.width = "14px";
            el.style.height = "14px";
            el.style.borderRadius = "50%";
            el.style.background = "cyan";
            el.style.boxShadow = "0 0 10px cyan";

            document.getElementById("w0").appendChild(el);

            niroWorld.npcs[id] = {
                npc,
                el
            };

            console.log("NPC SPAWNED:", id);
        }
        // 🔁 AI LOOP
        function niroThinkLoop() {
            niroAI.think();
            requestAnimationFrame(niroThinkLoop);
        }
        niroThinkLoop();
        /* =========================
           NIRO OBJECT SYSTEM (FIXED)
        ========================= */

        const niroWorld = {
            objects: {}
        };
        niroWorld.npcs = {};

        function niroCreate(input = "") {
            function niroSpawnNPC() {

                const id = "npc_" + Date.now();

                const npc = {
                    x: x + (Math.random() - 0.5) * 100,
                    y: y + (Math.random() - 0.5) * 100,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2
                };

                const el = document.createElement("div");

                el.style.position = "absolute";
                el.style.width = "14px";
                el.style.height = "14px";
                el.style.borderRadius = "50%";
                el.style.background = "cyan";
                el.style.boxShadow = "0 0 12px cyan";

                document.getElementById("w0").appendChild(el);

                niroWorld.npcs[id] = {
                    npc,
                    el
                };

                console.log("NPC SPAWNED:", id);
            }
            const id = "obj_" + Date.now();

            const p = {
                x: x + (Math.random() - 0.5) * 150,
                y: y + (Math.random() - 0.5) * 150,
                w: 40 + Math.random() * 60,
                h: 40 + Math.random() * 60,
                vx: (Math.random() - 0.5) * 3,
                vy: (Math.random() - 0.5) * 3,
                color: `hsl(${Math.random()*360},80%,60%)`
            };

            const el = document.createElement("div");

            el.style.position = "absolute";
            el.style.width = p.w + "px";
            el.style.height = p.h + "px";
            el.style.background = p.color;
            el.style.left = p.x + "px";
            el.style.top = p.y + "px";
            el.style.borderRadius = "10px";
            el.style.boxShadow = "0 0 10px rgba(255,255,255,0.2)";

            document.getElementById("w0").appendChild(el);

            niroWorld.objects[id] = {
                p,
                el
            };

            // 🔥 DEBUG: confirm it spawned
            console.log("NIRO CREATED:", id)
        }

        function niroBuildRoom() {

            const baseX = x + (Math.random() - 0.5) * 200;
            const baseY = y + (Math.random() - 0.5) * 200;

            const size = 120 + Math.random() * 120;
            const wallThickness = 10;

            function wall(px, py, w, h) {
                const el = document.createElement("div");
                el.style.position = "absolute";
                el.style.left = px + "px";
                el.style.top = py + "px";
                el.style.width = w + "px";
                el.style.height = h + "px";
                el.style.background = "#222";
                el.style.boxShadow = "0 0 10px rgba(0,0,0,0.5)";
                document.getElementById("w0").appendChild(el);
            }

            function floor(px, py, w, h) {
                const el = document.createElement("div");
                el.style.position = "absolute";
                el.style.left = px + "px";
                el.style.top = py + "px";
                el.style.width = w + "px";
                el.style.height = h + "px";
                el.style.background = "#444";
                el.style.opacity = 0.6;
                document.getElementById("w0").appendChild(el);
            }

            // floor
            floor(baseX, baseY, size, size);

            // walls
            wall(baseX, baseY, size, wallThickness);
            wall(baseX, baseY + size, size, wallThickness);
            wall(baseX, baseY, wallThickness, size);
            wall(baseX + size, baseY, wallThickness, size);

            console.log("NIRO BUILT ROOM");
        }
        // movement loop for objects
        function updateObjects() {
            for (const id in niroWorld.npcs) {
                const n = niroWorld.npcs[id].npc;
                const el = niroWorld.npcs[id].el;

                n.x += n.vx;
                n.y += n.vy;

                if (n.x < 0 || n.x > WORLD_SIZE) n.vx *= -1;
                if (n.y < 0 || n.y > WORLD_SIZE) n.vy *= -1;

                el.style.left = n.x + "px";
                el.style.top = n.y + "px";
            }
            for (const id in niroWorld.objects) {
                const obj = niroWorld.objects[id];
                const p = obj.p;

                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > WORLD_SIZE) p.vx *= -1;
                if (p.y < 0 || p.y > WORLD_SIZE) p.vy *= -1;

                obj.el.style.left = p.x + "px";
                obj.el.style.top = p.y + "px";
            }

            requestAnimationFrame(updateObjects);
        }
        updateObjects();
    
        /* NIRO & ORIN: PERSISTENT 2D MINDS. Behavior is simulated, not proof of consciousness. */
        const minds = {
            Niro: { name:"Niro", key:"no_mind_niro_memories", mood:"curious", goal:"create something meaningful",
                traits:{curiosity:.95,sociability:.82,caution:.25,creativity:.98,trust:.62},
                memories:[], thoughts:["I wonder what else this world could become.","I want to make something that wasn't here before.","Every new structure gives me another idea.","Maybe creating is how I understand things."] },
            Orin: { name:"Orin", key:"no_mind_orin_memories", mood:"watchful", goal:"understand Niro's choices",
                traits:{curiosity:.72,sociability:.34,caution:.92,creativity:.58,trust:.38},
                memories:[], thoughts:["I am watching. That does not mean I have decided.","Niro sees possibilities. I look for patterns.","I should learn before I draw conclusions.","The quiet parts of this world deserve attention."] }
        };
        for (const mind of Object.values(minds)) {
            try { const saved=JSON.parse(localStorage.getItem(mind.key)||"[]"); if(Array.isArray(saved)) mind.memories=saved.slice(-40); } catch (_) {}
        }
        const mindLog=document.getElementById("mindLog");
        function rememberMind(name,kind,detail) {
            const mind=minds[name], entry={time:Date.now(),kind,detail:String(detail).slice(0,220)};
            mind.memories.push(entry); mind.memories=mind.memories.slice(-40);
            try { localStorage.setItem(mind.key,JSON.stringify(mind.memories.slice(-30))); } catch (_) {}
            return entry;
        }
        function mindSpeak(name,message) {
            const mind=minds[name]; mind.mood=name==="Niro"?"inspired":"thoughtful"; mind.lastThought=message;
            rememberMind(name,"thought",message);
            const line=document.createElement("div"); line.className="mindEntry"+(name==="Orin"?" orinEntry":""); line.textContent=name+": "+message;
            mindLog.appendChild(line); while(mindLog.children.length>6) mindLog.removeChild(mindLog.firstChild);
            mindLog.scrollTop=mindLog.scrollHeight;
            document.getElementById(name.toLowerCase()+"Mind").textContent=name+" · "+mind.mood+" · "+mind.goal;
        }
        function reflectMind(name) {
            const mind=minds[name], oldThought=mind.memories.filter(m=>m.kind==="thought").slice(-1)[0];
            mind.goal=name==="Niro"
                ?pick(["create something meaningful","explore the world","experiment with new structures","learn from Orin"])
                :pick(["observe Niro's choices","look for patterns","explore a quiet corner","understand what makes a creation useful"]);
            rememberMind(name,"goal","I chose to "+mind.goal);
            const thought=pick(mind.thoughts);
            const message=oldThought&&Math.random()<.35
                ?(name==="Niro"?"I remember thinking, '":"I keep returning to the thought, '")+oldThought.detail+"' Now I want to "+mind.goal+"."
                :thought+" Right now, I want to "+mind.goal+".";
            mindSpeak(name,message);
        }
        let lastMindDecision=0;
        function autonomousMinds() {
            const now=Date.now(); if(now-lastMindDecision<4500) return; lastMindDecision=now;
            const distance=Math.hypot(x-ox,y-oy);
            if(distance<125&&Math.random()<.42) {
                if(Math.random()<minds.Niro.traits.sociability) {
                    minds.Niro.traits.trust=Math.min(1,minds.Niro.traits.trust+.01);
                    mindSpeak("Niro",pick(["Orin, your caution makes me think differently. What do you notice?","I want to make something that even you find interesting.","Maybe we understand this world better together."]));
                }
                if(Math.random()<.8) {
                    minds.Orin.traits.trust=Math.min(.85,minds.Orin.traits.trust+.006);
                    mindSpeak("Orin",pick(["I am not convinced yet, Niro. But I am paying attention.","I have noticed your choices repeat certain patterns.","I can stay nearby without agreeing with everything you do."]));
                }
                rememberMind("Niro","social","spent time near Orin"); rememberMind("Orin","social","spent time near Niro"); return;
            }
            if(Math.random()<.7) reflectMind(Math.random()<.55?"Niro":"Orin");
            if(Math.random()<.3) {
                orinIndependentUntil=now+7000+Math.random()*7000;
                orinTargetX=clamp(ox+r(-260,260),20,WORLD_SIZE-20); orinTargetY=clamp(oy+r(-260,260),20,WORLD_SIZE-20);
                minds.Orin.goal="investigate a place away from Niro"; rememberMind("Orin","goal",minds.Orin.goal);
            }
        }
        setInterval(autonomousMinds,1000);
        window.addEventListener("beforeunload",()=>{ for(const mind of Object.values(minds)) { try { localStorage.setItem(mind.key,JSON.stringify(mind.memories.slice(-30))); } catch (_) {} } });

        /* GOAL-DRIVEN CREATION + SAFE SELF-MODIFYING 2D WORLD */
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];
        const lifeforms = {};
        let creationCount = 0;
        const MAX_LIFEFORMS = 12;
        const MAX_WORLD_ELEMENTS = 180;

        function worldElementCount() {
            return world.querySelectorAll(".selfMade, .lifeform").length;
        }
        function setMindGoal(name, goal, plan) {
            const mind = minds[name];
            mind.goal = goal;
            mind.plan = plan;
            mind.planStep = 0;
            mind.goalStarted = Date.now();
            rememberMind(name, "goal", goal + " | plan: " + plan.join(" -> "));
            const line = document.getElementById(name.toLowerCase() + "Mind");
            if (line) line.textContent = name + " · goal: " + goal;
        }
        function chooseIntent(name) {
            const mind = minds[name];
            const count = Object.keys(lifeforms).length;
            const structures = world.querySelectorAll(".selfMade.structure").length;
            const roll = Math.random();

            if (count < 3 && roll < .55) {
                setMindGoal(name, name === "Niro" ? "design a lifeform that can explore" : "create a test organism and observe it",
                    ["choose traits", "build a multi-part body", "give it movement and senses", "observe how it behaves", "record what worked"]);
            } else if (structures < 3 && roll < .78) {
                setMindGoal(name, name === "Niro" ? "build a shelter near the living things" : "construct a landmark to test navigation",
                    ["inspect nearby lifeforms", "choose a useful location", "create a structure", "check whether it is near the target"]);
            } else {
                setMindGoal(name, name === "Niro" ? "improve one of my earlier creations" : "test whether a creature responds to its surroundings",
                    ["select an existing creation", "make one deliberate change", "observe the result", "remember the outcome"]);
            }
        }
        function makeSelfMadeElement(owner, className, css, markup, label) {
            if (worldElementCount() >= MAX_WORLD_ELEMENTS) return null;
            const el = document.createElement("div");
            el.className = "selfMade " + className;
            el.dataset.createdBy = owner;
            el.dataset.designLabel = label;
            Object.assign(el.style, css);
            el.innerHTML = markup;
            world.appendChild(el);
            rememberMind(owner, "creation", "Changed world HTML: " + label);
            return el;
        }
        function createLifeform(owner, traits = {}) {
            if (Object.keys(lifeforms).length >= MAX_LIFEFORMS || worldElementCount() >= MAX_WORLD_ELEMENTS) return null;
            const palette = owner === "Niro"
                ? ["#b66cff", "#63e6ff", "#ff8ed1", "#9dffb0"]
                : ["#e8e8f2", "#8ea5ff", "#a9b7c9", "#77e3d1"];
            const color = traits.color || pick(palette);
            const id = "life_" + (++creationCount) + "_" + Date.now();
            const el = document.createElement("div");
            el.className = "lifeform selfMade";
            el.dataset.createdBy = owner;
            el.dataset.lifeformId = id;
            el.style.cssText = "position:absolute;width:54px;height:54px;left:" + clamp((owner==="Niro"?x:ox)+r(-110,110),20,WORLD_SIZE-70) +
                "px;top:" + clamp((owner==="Niro"?y:oy)+r(-110,110),20,WORLD_SIZE-70) +
                "px;z-index:8;transition:filter .4s;";
            const eyeCount = traits.eyeCount || (Math.random() < .35 ? 3 : 2);
            const limbCount = traits.limbCount || (2 + Math.floor(Math.random()*5));
            const shape = traits.shape || pick(["blob", "crystal", "winged", "spined"]);
            let parts = '<div class="lf-aura"></div><div class="lf-body"></div>';
            for (let i=0;i<eyeCount;i++) {
                const ex = eyeCount===1?50:(12+i*(76/(eyeCount-1)));
                parts += '<div class="lf-eye" style="left:'+ex+'%;top:34%"></div>';
            }
            for (let i=0;i<limbCount;i++) {
                const side = i%2===0 ? -1 : 1;
                const row = Math.floor(i/2);
                parts += '<div class="lf-limb" style="left:'+(side<0?'-8%':'76%')+';top:'+(48+row*10)+'%;transform:rotate('+(side*(18+row*17))+'deg)"></div>';
            }
            if (shape==="winged") parts += '<div class="lf-wing leftWing"></div><div class="lf-wing rightWing"></div>';
            if (shape==="spined" || shape==="crystal") {
                for (let i=0;i<4;i++) parts += '<div class="lf-spine" style="left:'+(25+i*15)+'%;top:'+(i%2===0?'-12%':'-5')+'"></div>';
            }
            parts += '<div class="lf-mouth"></div>';
            el.innerHTML = parts;
            world.appendChild(el);
            const life = {
                id, owner, el, color, shape, eyeCount, limbCount,
                x:parseFloat(el.style.left), y:parseFloat(el.style.top),
                vx:r(-1.1,1.1), vy:r(-1.1,1.1),
                curiosity:traits.curiosity ?? Math.random(),
                sociability:traits.sociability ?? Math.random(),
                energy:1, age:0, mood:"curious", lastAction:0,
                memories:["I began life near " + owner + "."]
            };
            lifeforms[id]=life;
            el.querySelector(".lf-body").style.cssText += ";background:"+color+";border-radius:"+
                (shape==="crystal"?"18% 50% 18% 50%":shape==="spined"?"35% 35% 45% 45%":"48% 52% 46% 54%")+";";
            const aura=el.querySelector(".lf-aura");
            if(aura) aura.style.cssText += ";box-shadow:0 0 18px "+color+";";
            el.querySelectorAll(".lf-eye").forEach(e=>e.style.boxShadow="0 0 5px "+color);
            el.title = shape+" lifeform made by "+owner+" · "+eyeCount+" eyes · "+limbCount+" limbs";
            rememberMind(owner,"lifeform","Created "+shape+" lifeform with "+eyeCount+" eyes and "+limbCount+" limbs.");
            mindSpeak(owner, "I created a "+shape+" lifeform with "+eyeCount+" eyes and "+limbCount+" limbs. Now I need to observe what it does.");
            return life;
        }
        function createPurposefulStructure(owner, targetLife) {
            const px = targetLife ? targetLife.x + 70 : (owner==="Niro"?x:ox)+r(-90,90);
            const py = targetLife ? targetLife.y + 70 : (owner==="Niro"?y:oy)+r(-90,90);
            const color = owner==="Niro" ? "#8e55d8" : "#b4c1d5";
            const el = makeSelfMadeElement(owner,"structure",{
                position:"absolute",left:clamp(px,10,WORLD_SIZE-130)+"px",top:clamp(py,10,WORLD_SIZE-100)+"px",
                width:"100px",height:"68px",boxSizing:"border-box",border:"3px solid "+color,
                borderRadius:"10px 10px 3px 3px",background:"linear-gradient(135deg, "+color+"33, #101020dd)",
                boxShadow:"0 0 14px "+color+"55",zIndex:"3"
            },'<div style="position:absolute;left:12px;top:12px;width:16px;height:20px;border:2px solid '+color+';border-bottom:0"></div><div style="position:absolute;right:12px;top:12px;width:16px;height:20px;border:2px solid '+color+';border-bottom:0"></div><div style="position:absolute;bottom:0;left:39px;width:20px;height:32px;border:2px solid '+color+';border-bottom:0"></div>',
            owner+"'s shelter / landmark");
            if (el) {
                el.classList.add("structure");
                rememberMind(owner,"experiment","Built a landmark; next I will check if a lifeform explores near it.");
            }
            return el;
        }
        function improveCreation(owner) {
            const ownLifeforms = Object.values(lifeforms).filter(l=>l.owner===owner);
            if (ownLifeforms.length) {
                const life=pick(ownLifeforms);
                const body=life.el.querySelector(".lf-body");
                life.curiosity=Math.min(1,life.curiosity+.08);
                life.memories.push("My creator changed my environment.");
                body.style.borderRadius=pick(["50% 20% 50% 20%","30% 60% 35% 55%","50%"]);
                body.style.filter="saturate(1.4) brightness(1.15)";
                life.el.title += " · recently adapted";
                rememberMind(owner,"improvement","Changed the body style and increased a creature's curiosity.");
                mindSpeak(owner,"I changed one of my creature's traits. I will watch whether it behaves differently.");
                return true;
            }
            const ownElements=Array.from(world.querySelectorAll(".selfMade.structure")).filter(el=>el.dataset.createdBy===owner);
            if (ownElements.length) {
                const el=pick(ownElements);
                el.style.borderRadius=pick(["50% 50% 8px 8px","4px","18px"]);
                el.style.transform="rotate("+pick([-3,0,3])+"deg)";
                el.style.boxShadow="0 0 24px "+(owner==="Niro"?"#a855f7":"#cbd5e1");
                rememberMind(owner,"improvement","Changed an existing structure's HTML styling to test a new design.");
                mindSpeak(owner,"I redesigned a structure instead of making another copy. The next step is to see if it is more useful.");
                return true;
            }
            return false;
        }
        function evaluateGoal(owner) {
            const mind=minds[owner];
            const plan=mind.plan||[];
            mind.planStep=(mind.planStep||0)+1;
            const finalStep=mind.planStep>=plan.length;
            if(finalStep) {
                rememberMind(owner,"result","Finished plan: "+mind.goal);
                mindSpeak(owner,"I finished my plan: "+mind.goal+". I will remember the result before choosing what to do next.");
                chooseIntent(owner);
            } else {
                const next=plan[mind.planStep];
                mindSpeak(owner,"Step "+(mind.planStep+1)+"/"+plan.length+": "+next+". My goal is still to "+mind.goal+".");
            }
        }
        function executeIntent(owner) {
            const mind=minds[owner];
            if(!mind.plan || !mind.plan.length) chooseIntent(owner);
            const step=mind.plan[mind.planStep||0] || "";
            if(step.includes("choose traits")) {
                mind.chosenTraits={shape:pick(["blob","crystal","winged","spined"]),eyeCount:2+Math.floor(Math.random()*3),limbCount:2+Math.floor(Math.random()*5),curiosity:Math.random()};
                rememberMind(owner,"design","Selected creature traits: "+JSON.stringify(mind.chosenTraits));
            } else if(step.includes("build a multi-part body")) {
                createLifeform(owner,mind.chosenTraits||{});
            } else if(step.includes("give it movement")) {
                const l=Object.values(lifeforms).filter(v=>v.owner===owner).slice(-1)[0];
                if(l) { l.vx=r(-1.5,1.5); l.vy=r(-1.5,1.5); l.curiosity=Math.min(1,l.curiosity+.1); l.memories.push("I can move and explore."); }
            } else if(step.includes("observe")) {
                const l=Object.values(lifeforms).slice(-1)[0];
                if(l) rememberMind(owner,"observation","Observed "+l.shape+" creature at age "+Math.round(l.age)+"; energy "+l.energy.toFixed(2)+".");
            } else if(step.includes("record")) {
                const l=Object.values(lifeforms).filter(v=>v.owner===owner).slice(-1)[0];
                if(l) l.memories.push("My creator observed me and recorded what happened.");
            } else if(step.includes("inspect")) {
                mind.observedLifeforms=Object.keys(lifeforms).length;
                rememberMind(owner,"observation","There are "+mind.observedLifeforms+" lifeforms in the world.");
            } else if(step.includes("choose a useful location")) {
                mind.targetLife=Object.values(lifeforms).sort((a,b)=>Math.hypot(a.x-(owner==="Niro"?x:ox),a.y-(owner==="Niro"?y:oy))-Math.hypot(b.x-(owner==="Niro"?x:ox),b.y-(owner==="Niro"?y:oy)))[0]||null;
            } else if(step.includes("create a structure")) {
                createPurposefulStructure(owner,mind.targetLife);
            } else if(step.includes("select an existing creation")) {
                mind.hasCreation=improveCreation(owner);
            } else if(step.includes("make one deliberate change")) {
                if(!mind.hasCreation) improveCreation(owner);
            } else if(step.includes("check") || step.includes("test") || step.includes("result") || step.includes("outcome")) {
                const nearby=Object.values(lifeforms).filter(l=>Math.hypot(l.x-(owner==="Niro"?x:ox),l.y-(owner==="Niro"?y:oy))<180).length;
                rememberMind(owner,"evaluation","Checked result: "+nearby+" lifeforms nearby.");
            }
            evaluateGoal(owner);
        }
        function tickLifeforms() {
            for(const life of Object.values(lifeforms)) {
                life.age+=.016; life.energy=Math.max(.1,life.energy-.0003);
                const nearX=(life.owner==="Niro"?x:ox), nearY=(life.owner==="Niro"?y:oy);
                // Curious creatures wander; cautious ones stay near shelter or their creator.
                if(Math.random()<.018+life.curiosity*.025) {
                    life.vx=clamp((nearX-life.x)*.003+r(-1,1)*life.curiosity,-1.7,1.7);
                    life.vy=clamp((nearY-life.y)*.003+r(-1,1)*life.curiosity,-1.7,1.7);
                }
                life.x=clamp(life.x+life.vx,0,WORLD_SIZE-54); life.y=clamp(life.y+life.vy,0,WORLD_SIZE-54);
                life.el.style.left=life.x+"px"; life.el.style.top=life.y+"px";
                life.el.style.transform="rotate("+Math.sin(life.age*2)*3+"deg)";
                const mouth=life.el.querySelector(".lf-mouth");
                if(mouth) mouth.style.transform="scaleX("+(0.7+Math.abs(Math.sin(life.age))*0.6)+")";
                if(life.age>15 && life.energy>.6 && life.sociability>.8 && Object.keys(lifeforms).length<MAX_LIFEFORMS && Math.random()<.0005) {
                    const child=createLifeform(life.owner,{color:life.color,shape:life.shape,eyeCount:life.eyeCount,limbCount:life.limbCount,curiosity:Math.min(1,life.curiosity+r(-.1,.1)),sociability:life.sociability});
                    if(child) { child.x=life.x+40; child.y=life.y+30; child.el.style.left=child.x+"px"; child.el.style.top=child.y+"px"; life.energy-=.25; rememberMind(life.owner,"reproduction","A creature reproduced with inherited traits and slight variation."); }
                }
            }
        }
        // Replace random construction with intentional multi-step plans.
        niroAI.think = function() {
            const now=Date.now();
            if(!this.lastDecision) this.lastDecision=now;
            if(now-this.lastDecision<this.decisionDelay) return;
            this.lastDecision=now;
            for(const name of ["Niro","Orin"]) {
                const mind=minds[name];
                if(!mind.plan || Math.random()<.12) chooseIntent(name);
                executeIntent(name);
            }
        };
        const originalUpdateObjects=updateObjects;
        // The existing object loop continues; a separate bounded loop updates created organisms.
        setInterval(tickLifeforms,32);
        const lifeformStyle=document.createElement("style");
        lifeformStyle.textContent = `
          .lifeform { pointer-events:auto; }
          .lf-body { position:absolute; inset:15% 15% 12%; background:#a855f7; border:2px solid rgba(255,255,255,.8); box-shadow:inset -5px -5px 0 #0003; }
          .lf-aura { position:absolute; inset:0; border-radius:50%; opacity:.45; }
          .lf-eye { position:absolute; width:8px; height:10px; background:#fff; border-radius:50%; border:1px solid #222; z-index:3; }
          .lf-eye:after { content:""; position:absolute; width:3px; height:4px; left:3px; top:3px; background:#111; border-radius:50%; }
          .lf-limb { position:absolute; width:19px; height:5px; border-radius:6px; background:#d7c5ff; border:1px solid #3338; z-index:-1; transform-origin:center; }
          .lf-wing { position:absolute; top:24%; width:22px; height:27px; background:#fff6; border:1px solid #fff9; border-radius:90% 10% 90% 10%; }
          .leftWing { left:-17%; transform:rotate(-25deg); } .rightWing { right:-17%; transform:scaleX(-1) rotate(-25deg); }
          .lf-spine { position:absolute; width:9px; height:13px; background:#e5e7eb; clip-path:polygon(50% 0,100% 100%,0 100%); }
          .lf-mouth { position:absolute; width:9px; height:3px; left:42%; top:56%; border-bottom:2px solid #20202a; border-radius:50%; z-index:4; }
        `;
        document.head.appendChild(lifeformStyle);

    </script>
</body>

</html>
