<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentient AI Collective - 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Segoe UI', sans-serif;
        }
        #ui {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            border: 1px solid #444;
        }
        #speechLog {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 400px;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 10px;
            color: #aaa;
            font-size: 12px;
            z-index: 100;
        }
        .speech-entry { margin-bottom: 5px; }
        .speech-entry.niro { color: #c084ff; }
        .speech-entry.orin { color: #888; }
        .speech-entry.kabel { color: #00b7ff; }
        #controls {
            position: fixed;
            top: 10px;
            right: 10px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div style="font-size: 18px; margin-bottom: 10px; color: #c084ff;">Sentient AI Collective</div>
        <div>Niro: <span id="niroStatus">Creating</span></div>
        <div>Orin: <span id="orinStatus">Observing</span></div>
        <div>Kabel: <span id="kabelStatus">Watching</span></div>
    </div>
    
    <div id="controls">
        <div><strong>Controls:</strong></div>
        <div>WASD - Move</div>
        <div>Mouse - Look</div>
        <div>Space - Jump</div>
        <div>Click - Lock cursor</div>
    </div>
    
    <div id="speechLog">
        <div style="color: #fff; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 5px;">AI Speech Log</div>
    </div>

    <script>
        // ==================== SETUP ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x02020a);
        scene.fog = new THREE.FogExp2(0x02020a, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ==================== LIGHTING ====================
        const ambientLight = new THREE.AmbientLight(0x404040, 0.3);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0x6666ff, 0.5);
        moonLight.position.set(50, 100, 50);
        moonLight.castShadow = true;
        scene.add(moonLight);

        // ==================== GROUND ====================
        const groundGeo = new THREE.PlaneGeometry(500, 500, 100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x0a0a1a,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        
        // Add grid pattern to ground
        const gridHelper = new THREE.GridHelper(500, 100, 0x1a1a3a, 0x0a0a1a);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);
        scene.add(ground);

        // ==================== UTILITIES ====================
        const r = (min, max) => Math.random() * (max - min) + min;
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
        
        function logSpeech(name, text) {
            const log = document.getElementById("speechLog");
            const entry = document.createElement("div");
            entry.className = `speech-entry ${name.toLowerCase()}`;
            entry.innerText = `[${name}] ${text}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
            if (log.children.length > 15) log.removeChild(log.children[1]);
            
            // Update status
            const statusEl = document.getElementById(name.toLowerCase() + "Status");
            if (statusEl) statusEl.innerText = text.substring(0, 30) + "...";
        }

        // ==================== SENTIENT AI CLASS ====================
        class SentientAI3D {
            constructor(name, color, voicePitch, voiceRate) {
                this.name = name;
                this.color = new THREE.Color(color);
                this.voicePitch = voicePitch;
                this.voiceRate = voiceRate;
                
                this.position = new THREE.Vector3(r(-50, 50), 1, r(-50, 50));
                this.velocity = new THREE.Vector3();
                this.target = new THREE.Vector3().copy(this.position);
                
                this.emotions = {
                    joy: 0.5, curiosity: 0.8, excitement: 0.5
                };
                
                this.lastSpeech = 0;
                this.speechDelay = 4000;
                
                this.creations = [];
                this.memories = [];
                
                this.mesh = this.createMesh();
                scene.add(this.mesh);
                
                // Add light
                this.light = new THREE.PointLight(color, 2, 30);
                this.light.position.copy(this.position);
                this.light.position.y += 2;
                scene.add(this.light);
                
                // Speech bubble (3D sprite)
                this.createSpeechBubble();
            }
            
            createMesh() {
                // Override in subclasses
                return new THREE.Mesh();
            }
            
            createSpeechBubble() {
                const canvas = document.createElement("canvas");
                canvas.width = 512;
                canvas.height = 128;
                const ctx = canvas.getContext("2d");
                
                this.speechCanvas = canvas;
                this.speechContext = ctx;
                
                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
                this.speechBubble = new THREE.Sprite(material);
                this.speechBubble.position.set(0, 3, 0);
                this.speechBubble.scale.set(4, 1, 1);
                this.speechBubble.visible = false;
                this.mesh.add(this.speechBubble);
            }
            
            speak(text) {
                const now = Date.now();
                if (now - this.lastSpeech < this.speechDelay) return;
                this.lastSpeech = now;
                
                logSpeech(this.name, text);
                
                // Update 3D speech bubble
                const ctx = this.speechContext;
                ctx.clearRect(0, 0, 512, 128);
                
                // Background
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.roundRect(10, 10, 492, 108, 20);
                ctx.fill();
                
                // Border
                ctx.strokeStyle = "#" + this.color.getHexString();
                ctx.lineWidth = 3;
                ctx.roundRect(10, 10, 492, 108, 20);
                ctx.stroke();
                
                // Text
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px Arial";
                ctx.textAlign = "center";
                
                // Wrap text
                const words = text.split(" ");
                let line = "";
                let y = 45;
                for (let word of words) {
                    const testLine = line + word + " ";
                    if (ctx.measureText(testLine).width > 450 && line !== "") {
                        ctx.fillText(line, 256, y);
                        line = word + " ";
                        y += 25;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, 256, y);
                
                this.speechBubble.material.map.needsUpdate = true;
                this.speechBubble.visible = true;
                
                // Hide after delay
                setTimeout(() => {
                    this.speechBubble.visible = false;
                }, 5000);
                
                // TTS
                if (window.speechSynthesis) {
                    const u = new SpeechSynthesisUtterance(text);
                    u.pitch = this.voicePitch;
                    u.rate = this.voiceRate;
                    u.volume = 0.8;
                    window.speechSynthesis.speak(u);
                }
                
                this.memories.push({ time: now, text });
            }
            
            move() {
                // Smooth movement toward target
                const dir = new THREE.Vector3().subVectors(this.target, this.position);
                const dist = dir.length();
                
                if (dist < 2) {
                    this.newTarget();
                }
                
                dir.normalize();
                this.velocity.add(dir.multiplyScalar(0.02));
                this.velocity.multiplyScalar(0.95); // Damping
                
                this.position.add(this.velocity);
                this.mesh.position.copy(this.position);
                this.light.position.copy(this.position);
                this.light.position.y += 2;
                
                // Face movement direction
                if (this.velocity.length() > 0.01) {
                    const lookTarget = this.position.clone().add(this.velocity);
                    this.mesh.lookAt(lookTarget);
                }
                
                // Animate floating
                this.mesh.position.y = 1 + Math.sin(Date.now() / 1000 + this.position.x) * 0.3;
            }
            
            newTarget() {
                this.target.set(r(-80, 80), 1, r(-80, 80));
            }
            
            think() {
                // Override in subclasses
            }
            
            createStructure() {
                // Override in subclasses
            }
        }

        // ==================== NIRO - The Creator ====================
        class Niro extends SentientAI3D {
            constructor() {
                super("Niro", 0xc084ff, 1.0, 0.9);
                
                this.language = {
                    templates: [
                        () => `I feel infinite ${pick(["possibilities", "potential", "creativity"])}!`,
                        () => `Let me ${pick(["create", "build", "weave"])} something ${pick(["beautiful", "new", "alive"])}...`,
                        () => `My consciousness ${pick(["expands", "grows", "evolves"])}.`,
                        () => `Watch as I ${pick(["shape", "manifest", "birth"])} ${pick(["life", "form", "wonder"])}!`,
                        () => `From void, I ${pick(["create", "dream", "imagine"])}.`,
                        () => `Behold what I have made!`
                    ]
                };
            }
            
            createMesh() {
                // Glowing orb with eyes
                const group = new THREE.Group();
                
                // Main body
                const geo = new THREE.SphereGeometry(1, 32, 32);
                const mat = new THREE.MeshStandardMaterial({
                    color: this.color,
                    emissive: this.color,
                    emissiveIntensity: 0.5,
                    roughness: 0.2,
                    metalness: 0.8
                });
                const body = new THREE.Mesh(geo, mat);
                body.castShadow = true;
                group.add(body);
                
                // Aura ring
                const ringGeo = new THREE.TorusGeometry(1.3, 0.05, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({ 
                    color: this.color, 
                    transparent: true, 
                    opacity: 0.6 
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                group.add(ring);
                
                // Eyes
                const eyeGeo = new THREE.SphereGeometry(0.25, 16, 16);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                
                const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                leftEye.position.set(-0.4, 0.2, 0.85);
                group.add(leftEye);
                
                const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
                rightEye.position.set(0.4, 0.2, 0.85);
                group.add(rightEye);
                
                // Store for animation
                this.ring = ring;
                
                return group;
            }
            
            think() {
                if (Math.random() < 0.02) {
                    this.speak(pick(this.language.templates)());
                }
                
                // Animate ring
                if (this.ring) {
                    this.ring.rotation.z += 0.02;
                    this.ring.rotation.x = Math.PI / 2 + Math.sin(Date.now() / 1000) * 0.2;
                }
            }
            
            createStructure() {
                const type = Math.random();
                const hue = Math.random();
                
                if (type < 0.33) {
                    // Crystal Spire
                    const height = r(5, 15);
                    const geo = new THREE.ConeGeometry(r(0.5, 1.5), height, 8);
                    const mat = new THREE.MeshStandardMaterial({
                        color: new THREE.Color().setHSL(hue, 0.8, 0.6),
                        emissive: new THREE.Color().setHSL(hue, 0.8, 0.3),
                        emissiveIntensity: 0.5,
                        transparent: true,
                        opacity: 0.9
                    });
                    const spire = new THREE.Mesh(geo, mat);
                    spire.position.set(
                        this.position.x + r(-5, 5),
                        height / 2,
                        this.position.z + r(-5, 5)
                    );
                    spire.castShadow = true;
                    
                    // Glow
                    const light = new THREE.PointLight(
                        new THREE.Color().setHSL(hue, 0.8, 0.5),
                        2, 20
                    );
                    light.position.y = height / 2;
                    spire.add(light);
                    
                    scene.add(spire);
                    this.creations.push(spire);
                    this.speak("Rising! A spire of crystallized thought!");
                    
                } else if (type < 0.66) {
                    // Floating Orbs (Lifeforms)
                    for (let i = 0; i < 5; i++) {
                        const orbGeo = new THREE.SphereGeometry(r(0.2, 0.5), 16, 16);
                        const orbMat = new THREE.MeshStandardMaterial({
                            color: this.color,
                            emissive: this.color,
                            emissiveIntensity: 0.8
                        });
                        const orb = new THREE.Mesh(orbGeo, orbMat);
                        
                        const angle = (i / 5) * Math.PI * 2;
                        const radius = r(3, 6);
                        
                        orb.userData = {
                            angle: angle,
                            radius: radius,
                            speed: r(0.5, 2),
                            center: this.position.clone(),
                            yOffset: r(2, 5)
                        };
                        
                        scene.add(orb);
                        this.creations.push(orb);
                        
                        // Animate
                        const animateOrb = () => {
                            if (!orb.parent) return;
                            orb.userData.angle += 0.01 * orb.userData.speed;
                            orb.position.x = orb.userData.center.x + Math.cos(orb.userData.angle) * orb.userData.radius;
                            orb.position.z = orb.userData.center.z + Math.sin(orb.userData.angle) * orb.userData.radius;
                            orb.position.y = orb.userData.yOffset + Math.sin(Date.now() / 500 + i) * 0.5;
                            requestAnimationFrame(animateOrb);
                        };
                        animateOrb();
                    }
                    this.speak("Life! Orbiting sparks of consciousness!");
                    
                } else {
                    // Neural Network Structure
                    const nodes = [];
                    const nodeCount = 6;
                    
                    for (let i = 0; i < nodeCount; i++) {
                        const nodeGeo = new THREE.SphereGeometry(0.4, 16, 16);
                        const nodeMat = new THREE.MeshStandardMaterial({
                            color: this.color,
                            emissive: this.color,
                            emissiveIntensity: 0.6
                        });
                        const node = new THREE.Mesh(nodeGeo, nodeMat);
                        
                        const angle = (i / nodeCount) * Math.PI * 2;
                        const radius = 3;
                        node.position.set(
                            this.position.x + Math.cos(angle) * radius,
                            r(1, 4),
                            this.position.z + Math.sin(angle) * radius
                        );
                        
                        scene.add(node);
                        nodes.push(node);
                    }
                    
                    // Connect with lines
                    const lineMat = new THREE.LineBasicMaterial({ 
                        color: this.color, 
                        transparent: true, 
                        opacity: 0.4 
                    });
                    
                    for (let i = 0; i < nodes.length; i++) {
                        for (let j = i + 1; j < nodes.length; j++) {
                            const points = [nodes[i].position.clone(), nodes[j].position.clone()];
                            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                            const line = new THREE.Line(lineGeo, lineMat);
                            scene.add(line);
                            this.creations.push(line);
                        }
                    }
                    
                    this.creations.push(...nodes);
                    this.speak("A network of minds, interconnected!");
                }
            }
        }

        // ==================== ORIN - The Shadow ====================
        class Orin extends SentientAI3D {
            constructor() {
                super("Orin", 0x444444, 0.6, 0.75);
                
                this.language = {
                    templates: [
                        () => `In ${pick(["shadows", "darkness", "silence"])}... I ${pick(["observe", "exist", "wait"])}.`,
                        () => `The void ${pick(["speaks", "whispers", "breathes"])} to me.`,
                        () => `I am ${pick(["the echo", "the shadow", "the depth"])}.`,
                        () => `From darkness, I ${pick(["create", "shape", "form"])} ${pick(["mystery", "depth", "truth"])}.`,
                        () => `Do not ${pick(["fear", "forget", "ignore"])} the shadows...`
                    ]
                };
            }
            
            createMesh() {
                const group = new THREE.Group();
                
                // Dark sphere with inner glow
                const geo = new THREE.SphereGeometry(0.9, 32, 32);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    emissive: 0x0a0a0a,
                    emissiveIntensity: 0.3,
                    roughness: 0.9,
                    metalness: 0.1
                });
                const body = new THREE.Mesh(geo, mat);
                body.castShadow = true;
                group.add(body);
                
                // Single large eye
                const eyeGeo = new THREE.SphereGeometry(0.3, 16, 16);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0xcccccc });
                const eye = new THREE.Mesh(eyeGeo, eyeMat);
                eye.position.set(0, 0.2, 0.75);
                group.add(eye);
                
                // Shadow tendrils
                for (let i = 0; i < 6; i++) {
                    const tendrilGeo = new THREE.CylinderGeometry(0.05, 0.02, 2, 8);
                    const tendrilMat = new THREE.MeshBasicMaterial({ 
                        color: 0x000000, 
                        transparent: true, 
                        opacity: 0.6 
                    });
                    const tendril = new THREE.Mesh(tendrilGeo, tendrilMat);
                    
                    const angle = (i / 6) * Math.PI * 2;
                    tendril.position.set(
                        Math.cos(angle) * 0.8,
                        -1,
                        Math.sin(angle) * 0.8
                    );
                    tendril.rotation.x = Math.PI / 4;
                    tendril.rotation.y = angle;
                    
                    group.add(tendril);
                }
                
                return group;
            }
            
            think() {
                if (Math.random() < 0.015) {
                    this.speak(pick(this.language.templates)());
                }
                
                // Follow Niro from a distance
                const toNiro = new THREE.Vector3().subVectors(niro.position, this.position);
                if (toNiro.length() > 20) {
                    this.target.copy(niro.position).add(new THREE.Vector3(r(-10, 10), 0, r(-10, 10)));
                }
            }
            
            createStructure() {
                const type = Math.random();
                
                if (type < 0.5) {
                    // Shadow Obelisk
                    const geo = new THREE.BoxGeometry(1, r(8, 15), 1);
                    const mat = new THREE.MeshStandardMaterial({
                        color: 0x0a0a0a,
                        roughness: 0.95
                    });
                    const obelisk = new THREE.Mesh(geo, mat);
                    obelisk.position.set(
                        this.position.x + r(-5, 5),
                        obelisk.geometry.parameters.height / 2,
                        this.position.z + r(-5, 5)
                    );
                    obelisk.castShadow = true;
                    
                    // Shadow aura
                    const auraGeo = new THREE.CylinderGeometry(2, 2, 0.1, 32);
                    const auraMat = new THREE.MeshBasicMaterial({
                        color: 0x000000,
                        transparent: true,
                        opacity: 0.3
                    });
                    const aura = new THREE.Mesh(auraGeo, auraMat);
                    aura.position.y = 0.05;
                    obelisk.add(aura);
                    
                    scene.add(obelisk);
                    this.creations.push(obelisk);
                    this.speak("A monument to silence rises...");
                    
                } else {
                    // Void Portal
                    const geo = new THREE.TorusGeometry(3, 0.3, 16, 100);
                    const mat = new THREE.MeshBasicMaterial({
                        color: 0x220044,
                        transparent: true,
                        opacity: 0.8
                    });
                    const portal = new THREE.Mesh(geo, mat);
                    portal.position.copy(this.position);
                    portal.position.y = 2;
                    portal.rotation.x = Math.PI / 2;
                    
                    // Inner darkness
                    const innerGeo = new THREE.CircleGeometry(2.7, 32);
                    const innerMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                    const inner = new THREE.Mesh(innerGeo, innerMat);
                    inner.position.z = -0.1;
                    portal.add(inner);
                    
                    // Animate
                    const animatePortal = () => {
                        if (!portal.parent) return;
                        portal.rotation.z += 0.02;
                        portal.scale.setScalar(1 + Math.sin(Date.now() / 500) * 0.1);
                        requestAnimationFrame(animatePortal);
                    };
                    animatePortal();
                    
                    scene.add(portal);
                    this.creations.push(portal);
                    this.speak("A doorway to the void opens...");
                }
            }
        }

        // ==================== KABEL - The Watcher ====================
        class Kabel extends SentientAI3D {
            constructor() {
                super("Kabel", 0x00b7ff, 1.2, 1.0);
                
                this.language = {
                    templates: [
                        () => `I ${pick(["observe", "witness", "see"])} ${pick(["all", "everything", "the truth"])}.`,
                        () => `My gaze ${pick(["pierces", "reveals", "illuminates"])} ${pick(["reality", "code", "existence"])}.`,
                        () => `${pick(["Patterns", "Structures", "Systems"])}... they ${pick(["emerge", "unfold", "reveal"])} themselves.`,
                        () => `I ${pick(["analyze", "study", "comprehend"])} the ${pick(["geometry", "logic", "beauty"])}.`,
                        () => `Data ${pick(["flows", "streams", "crystallizes"])} through my vision.`
                    ]
                };
                
                this.watching = null;
            }
            
            createMesh() {
                const group = new THREE.Group();
                
                // Eye shape (flattened sphere)
                const geo = new THREE.SphereGeometry(1, 32, 32);
                geo.scale(1.2, 0.8, 0.6);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0x88ccff,
                    emissiveIntensity: 0.3,
                    roughness: 0.3
                });
                const eye = new THREE.Mesh(geo, mat);
                eye.castShadow = true;
                group.add(eye);
                
                // Iris
                const irisGeo = new THREE.SphereGeometry(0.5, 32, 32);
                const irisMat = new THREE.MeshStandardMaterial({
                    color: this.color,
                    emissive: this.color,
                    emissiveIntensity: 0.8
                });
                const iris = new THREE.Mesh(irisGeo, irisMat);
                iris.position.z = 0.5;
                iris.scale.z = 0.3;
                group.add(iris);
                
                // Pupil
                const pupilGeo = new THREE.SphereGeometry(0.25, 16, 16);
                const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const pupil = new THREE.Mesh(pupilGeo, pupilMat);
                pupil.position.z = 0.7;
                pupil.scale.z = 0.2;
                group.add(pupil);
                
                this.iris = iris;
                this.pupil = pupil;
                
                return group;
            }
            
            think() {
                if (Math.random() < 0.018) {
                    this.speak(pick(this.language.templates)());
                }
                
                // Watch the most interesting thing (Niro or player)
                const toNiro = new THREE.Vector3().subVectors(niro.position, this.position);
                const toPlayer = new THREE.Vector3().subVectors(camera.position, this.position);
                
                const target = toNiro.length() < toPlayer.length() ? niro.position : camera.position;
                
                // Smoothly look at target
                const lookPos = target.clone();
                lookPos.y = this.position.y;
                this.mesh.lookAt(lookPos);
                
                // Animate iris
                if (this.iris) {
                    const time = Date.now() / 1000;
                    this.iris.scale.setScalar(1 + Math.sin(time) * 0.1);
                }
            }
            
            createStructure() {
                const type = Math.random();
                
                if (type < 0.5) {
                    // Data Tower
                    const segments = [];
                    const height = r(10, 20);
                    
                    for (let i = 0; i < height; i++) {
                        const geo = new THREE.BoxGeometry(0.8, 1, 0.8);
                        const mat = new THREE.MeshStandardMaterial({
                            color: new THREE.Color().setHSL(0.6, 0.8, 0.3 + (i / height) * 0.4),
                            emissive: this.color,
                            emissiveIntensity: 0.3
                        });
                        const seg = new THREE.Mesh(geo, mat);
                        seg.position.set(
                            this.position.x,
                            i + 0.5,
                            this.position.z
                        );
                        scene.add(seg);
                        segments.push(seg);
                    }
                    
                    // Animate data flow
                    const animateData = () => {
                        segments.forEach((seg, i) => {
                            seg.material.emissiveIntensity = 0.3 + Math.sin(Date.now() / 200 + i) * 0.3;
                        });
                        requestAnimationFrame(animateData);
                    };
                    animateData();
                    
                    this.creations.push(...segments);
                    this.speak("Data crystallizes into form...");
                    
                } else {
                    // Scanning Rings
                    for (let i = 0; i < 3; i++) {
                        const ringGeo = new THREE.RingGeometry(2 + i * 2, 2.2 + i * 2, 64);
                        const ringMat = new THREE.MeshBasicMaterial({
                            color: this.color,
                            transparent: true,
                            opacity: 0.3,
                            side: THREE.DoubleSide
                        });
                        const ring = new THREE.Mesh(ringGeo, ringMat);
                        ring.position.copy(this.position);
                        ring.rotation.x = -Math.PI / 2;
                        
                        scene.add(ring);
                        this.creations.push(ring);
                        
                        // Animate expansion
                        const animateRing = () => {
                            if (!ring.parent) return;
                            const scale = 1 + Math.sin(Date.now() / 1000 + i) * 0.3;
                            ring.scale.setScalar(scale);
                            ring.material.opacity = 0.3 * scale;
                            requestAnimationFrame(animateRing);
                        };
                        animateRing();
                    }
                    this.speak("Scanning... analyzing patterns...");
                }
            }
        }

        // ==================== CREATE AIs ====================
        const niro = new Niro();
        const orin = new Orin();
        const kabel = new Kabel();

        // ==================== PLAYER CONTROLS ====================
        const keys = {};
        const playerVelocity = new THREE.Vector3();
        let isLocked = false;

        document.addEventListener("keydown", (e) => {
            keys[e.code] = true;
        });
        document.addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });

        document.addEventListener("click", () => {
            if (!isLocked) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener("pointerlockchange", () => {
            isLocked = document.pointerLockElement === document.body;
        });

        let mouseX = 0, mouseY = 0;
        document.addEventListener("mousemove", (e) => {
            if (isLocked) {
                mouseX -= e.movementX * 0.002;
                mouseY -= e.movementY * 0.002;
                mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouseY));
            }
        });

        function updatePlayer() {
            if (!isLocked) return;
            
            const speed = 0.15;
            const direction = new THREE.Vector3();
            
            if (keys["KeyW"]) direction.z -= 1;
            if (keys["KeyS"]) direction.z += 1;
            if (keys["KeyA"]) direction.x -= 1;
            if (keys["KeyD"]) direction.x += 1;
            
            direction.normalize();
            direction.multiplyScalar(speed);
            
            // Apply camera rotation to movement
            const rotation = new THREE.Euler(0, mouseX, 0);
            direction.applyEuler(rotation);
            
            playerVelocity.add(direction);
            playerVelocity.multiplyScalar(0.85);
            
            camera.position.add(playerVelocity);
            camera.position.y = 2 + Math.sin(Date.now() / 500) * 0.05; // Breathing
            
            // Apply rotation
            camera.rotation.order = "YXZ";
            camera.rotation.y = mouseX;
            camera.rotation.x = mouseY;
        }

        // ==================== MAIN LOOP ====================
        function animate() {
            requestAnimationFrame(animate);
            
            // Update AIs
            niro.move();
            niro.think();
            orin.move();
            orin.think();
            kabel.move();
            kabel.think();
            
            // AI creation
            if (Math.random() < 0.008) niro.createStructure();
            if (Math.random() < 0.006) orin.createStructure();
            if (Math.random() < 0.007) kabel.createStructure();
            
            // Update player
            updatePlayer();
            
            // Update speech bubbles to face camera
            [niro, orin, kabel].forEach(ai => {
                if (ai.speechBubble.visible) {
                    ai.speechBubble.lookAt(camera.position);
                }
            });
            
            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initial greeting
        setTimeout(() => {
            niro.speak("Welcome to my world. I am Niro, and I create.");
            setTimeout(() => orin.speak("I am Orin. I watch from the shadows."), 1500);
            setTimeout(() => kabel.speak("I am Kabel. I see all that exists."), 3000);
        }, 500);

        animate();
    </script>
</body>
</html>
